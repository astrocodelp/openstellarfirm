# Builds StellarFirm Open installers and attaches them to a GitHub Release
# on this repository. See docs/releasing.md.
#
#   vX.Y.Z        stable release, marked latest
#   vX.Y.Z-rc.N   release candidate, published as a prerelease
#
# A manual run builds test installers and publishes nothing.
#
# Do not add a pull request trigger. The parse and publish jobs use the
# org's self-hosted Fly runners, and on a public repository those runners
# would execute whatever code a fork sent.
#
# Parse and publish run on the Fly runners. The installers are built on
# GitHub-hosted macOS and Windows: a macOS disk image cannot be made on
# Linux, and Windows signing runs on Windows.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarise (fails if this platform's signing secrets are missing; publishes nothing)
        type: boolean
        default: false

# Only the publish job may write repository contents, which is how it
# creates the Release.
# The build jobs also need actions: write so they can upload artifacts, and
# publish needs actions: read to download them.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Parse release tag
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      publish: ${{ steps.parse.outputs.publish }}
      signing_mode: ${{ steps.parse.outputs.signing_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Parse the tag
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          SIGN_INPUT: ${{ inputs.sign }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/release.mjs parse

      # The Fly runner keeps its disk. Leave the checkout off it.
      - name: Remove the checkout from the runner disk
        if: always()
        run: |
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

  build:
    name: ${{ matrix.label }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-x64
            os: macos-15-intel
            platform: mac
            package_script: package:mac-x64
            label: macOS Intel
          - target: mac-arm64
            os: macos-15
            platform: mac
            package_script: package:mac-arm64
            label: macOS Apple silicon
          - target: win-x64
            os: windows-latest
            platform: win
            package_script: package:win
            label: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the installer version from the tag
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          node scripts/release.mjs check-version
          npm pkg set "version=${VERSION}"

      # A tag signs when this platform's secrets are complete, and stays
      # unsigned when they are all absent. A half-filled set fails the job
      # and names what is missing. A manual run signs only when asked.
      - name: Decide signing
        id: signing
        env:
          SIGNING_MODE: ${{ needs.meta.outputs.signing_mode }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.platform == 'win' && vars.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.platform == 'win' && vars.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ matrix.platform == 'win' && vars.AZURE_TRUSTED_SIGNING_PROFILE || '' }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ matrix.platform == 'win' && vars.AZURE_TRUSTED_SIGNING_PUBLISHER || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: node scripts/release.mjs prepare "${PLATFORM}" "${TARGET}"

      - name: Package
        env:
          PACKAGE_SCRIPT: ${{ matrix.package_script }}
          CSC_LINK: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_TENANT_ID: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          WIN_CSC_LINK: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ steps.signing.outputs.signing_active == 'true' && matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          if [ -f electron-builder.signed.json ]; then
            pnpm run "${PACKAGE_SCRIPT}" -- --config electron-builder.signed.json
          else
            pnpm run "${PACKAGE_SCRIPT}"
          fi

      - name: Collect installers
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          RELEASE_DIR: release
          DEST_DIR: upload
          STATUS_PATH: signing-status-${{ matrix.target }}.json
        run: node scripts/release.mjs stage-target

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stellarfirm-open-${{ matrix.target }}
          path: upload/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: [self-hosted, fly, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: "stellarfirm-open-*"
          merge-multiple: true

      - name: Write release notes
        id: notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          ASSETS_DIR: release-assets
          NOTES_PATH: release-notes.md
          DEST_DIR: publish
        run: node scripts/release.mjs notes

      # This repository's own Release, with the job's GITHUB_TOKEN. A stable
      # tag is latest; a release candidate stays a prerelease.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.notes.outputs.title }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: "publish/*"

      - name: Remove the checkout from the runner disk
        if: always()
        run: |
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
