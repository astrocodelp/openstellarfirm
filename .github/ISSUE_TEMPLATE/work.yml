name: Agreed work
description: A piece of work that was agreed in Discussions and is ready to build.
labels: ["needs-triage"]
body:
  - type: input
    id: discussion
    attributes:
      label: Where it was agreed
      description: Link to the discussion or the roadmap item.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: What done looks like
      description: What a person can do when this is built, and what must stay true (see the promise in COMMUNITY.md).
    validations:
      required: true
