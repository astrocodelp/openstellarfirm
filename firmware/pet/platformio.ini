; The OpenStellarFirm desk pet firmware (Nova, Zib and Comet).
; Plan and rules: docs/desk-pets-plan.md. Hardware: hardware/pets/README.md.
;
;   pio run -e nano_esp32          the pet
;   pio run -e bringup             the hardware test firmware (bring-up checklist)
;   pio run -e devboard            the pet on a bare board, the laptop as its mic,
;                                  speaker and button (never a pet to pair for real)
;   pio run -e nano_esp32_first -t upload   the pet, first flash of a board
;   pio run -e bringup_first -t upload      the bring-up firmware, first flash
;   pio test -e native             the unit tests of the pure modules in src/core/
;
; This folder has no package.json, so `pnpm build` and `pnpm test` never need
; PlatformIO.

[platformio]
default_envs = nano_esp32

; Shared by the two device environments. The native environment does not extend
; it: it has no board, no framework and no libraries.
[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
board = arduino_nano_esp32
monitor_speed = 115200
board_build.partitions = partitions_pet.csv
board_build.filesystem = littlefs
; Exact versions, never a range: PlatformIO has no lock file, and a range lets a
; release nobody here read into the next image (ArduinoJson parses every answer
; of the server and the setup page, in the image that holds the pet's token).
; A library moves only through a reviewed change to this file. The platform
; above is a release zip whose own platform.json names the exact framework and
; toolchain it installs.
lib_deps =
  adafruit/Adafruit NeoPixel@1.12.3
  bblanchon/ArduinoJson@7.2.1
; CORE_DEBUG_LEVEL=0 compiles the Arduino core's own log_e/log_w/... lines out (its
; default keeps the error ones). The pet's only log is PET_LOG (src/hw/log.h), which
; follows the rules in its header.
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_USES_HW_GPIO_NUMBERS
  -DBOARD_HAS_PSRAM
  -Iinclude
  -Isrc
build_unflags = -std=gnu++11

; The pet leaves out the board's in-app DFU interface (the board definition turns it on
; with -DARDUINO_USB_DFU_ON_BOOT=1). With it, the running sketch lets any program on the
; computer, or a page with a WebUSB grant, write a new image into the next app slot and
; switch to it with no button pressed (`dfu-util -d 2341:0070 -D x.bin`, which is also
; what PlatformIO's DFU upload does), paired or not, and that would defeat the pet's
; fourth rule. Without it the pet's USB port is the serial port and nothing else, and
; an update needs the board's own bootloader by hand (double press of RST, then upload;
; or the B1 to GND jumper and a *_first environment). The bring-up firmware keeps it:
; it is a test image that never holds a pairing.
[env:nano_esp32]
extends = esp32_common
build_src_filter = +<*> -<bringup/> -<devboard/>
build_unflags =
  ${esp32_common.build_unflags}
  -DARDUINO_USB_DFU_ON_BOOT=1
build_flags =
  ${esp32_common.build_flags}
  -DARDUINO_USB_DFU_ON_BOOT=0

[env:bringup]
extends = esp32_common
build_src_filter = +<core/> +<audio/> +<ui/> +<hw/> +<bringup/>

; The pet's firmware on a bare Arduino Nano ESP32, with the laptop as its
; microphone, speaker, talk button and MIC switch over the USB cable
; (src/devboard/bridge.h, and the simulator's Board mode in a later phase). It carries audio and
; clip ids over USB, which the pet never does, and pairs as "nano-esp32-devboard":
; NEVER flash it onto a pet that will be paired for real. It keeps the board's DFU
; interface (like bring-up), so later uploads need no jumper. It talks to
; the address in PET_API_BASE, which PLATFORMIO_BUILD_FLAGS can set, and plays Nova unless
; PET_DEVBOARD_KIND says PET_KIND_ALIEN or PET_KIND_CAT.
[env:devboard]
extends = esp32_common
build_src_filter = +<*> -<bringup/>
build_flags =
  ${esp32_common.build_flags}
  -DPET_DEVBOARD
  -DPET_LINE_QUEUE_BYTES=32768

[env:devboard_first]
extends = env:devboard
upload_protocol = esptool

; First flash of a board: writes the bootloader, the pet's partition table and the
; app through the chip's own bootloader (B1 to GND, press RST). The default upload
; is DFU, which writes only the app, so it cannot lay down partitions_pet.csv.
; Later updates with the same flash map can use the two environments above.
[env:nano_esp32_first]
extends = env:nano_esp32
upload_protocol = esptool

[env:bringup_first]
extends = env:bringup
upload_protocol = esptool

; Unity tests on the computer. Only the pure modules in src/core/ build here:
; they include no Arduino header. -Werror is on for our own sources so a
; warning fails the test run the same way it does with the local g++ script.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=c++17
  -Iinclude
  -Isrc
  -DPET_NATIVE
build_src_flags =
  -Wall
  -Wextra
  -Werror
build_src_filter = -<*> +<core/>
