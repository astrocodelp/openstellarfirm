appId: ai.stellarfirm.open
productName: StellarFirm Open
artifactName: StellarFirm-Open-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 Vasileios Drosatos and Astro Code L.P. MIT licence.
directories:
  output: release
# Everything the app needs is bundled into dist/, so no node_modules ship.
files:
  - dist/**
  - package.json
  - LICENSE
  - THIRD-PARTY-NOTICES.md
asar: true
npmRebuild: false
# Fuses switch off, in the shipped program itself, the ways an installed
# Electron app can be made to run other code: as plain Node, through NODE_OPTIONS
# or --inspect, or from files outside the signed archive.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Stays on while the page is loaded from a file: switched off, the packaged
  # app cannot load its own page (tested). Serving the page from a protocol of
  # the app's own would let this go off; that is a follow-up.
  grantFileProtocolExtraPrivileges: true
  resetAdHocDarwinSignature: true
# Local builds stay unsigned. A GitHub Release (docs/releasing.md) signs only
# when that platform's signing secrets are set, and the release says so when
# they are not.
forceCodeSigning: false
publish: null
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  target:
    - target: nsis
      arch: [x64]
