appId: ai.stellarfirm.openstellarfirm
productName: OpenStellarFirm
artifactName: OpenStellarFirm-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 Astro Code L.P. Apache-2.0 with the Commons Clause.
directories:
  output: release
# Everything the app needs is bundled into dist/, so no node_modules ship.
files:
  - dist/**
  # Source maps help a developer, not a person running the app.
  - "!dist/**/*.map"
  - package.json
  - LICENSE
  - NOTICE
  - THIRD-PARTY-NOTICES.md
# The licence files again, as plain files beside the app (outside its archive),
# so anyone can read them: on a Mac in OpenStellarFirm.app/Contents/Resources,
# elsewhere in the resources folder of the installed app. THIRD-PARTY-LICENSES.txt
# is written by the build (scripts/licences.mjs).
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: dist/THIRD-PARTY-LICENSES.txt
    to: THIRD-PARTY-LICENSES.txt
asar: true
npmRebuild: false
# Fuses switch off, in the shipped program itself, the ways an installed
# Electron app can be made to run other code: as plain Node, through NODE_OPTIONS
# or --inspect, or from files outside the signed archive.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Stays on while the page is loaded from a file: switched off, the packaged
  # app cannot load its own page (tested). Serving the page from a protocol of
  # the app's own would let this go off; that is a follow-up.
  grantFileProtocolExtraPrivileges: true
  resetAdHocDarwinSignature: true
# Local builds stay unsigned. Releases are attached by hand or by a workflow.
forceCodeSigning: false
publish: null
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
linux:
  # Written as Categories=Utility;Office; in the .desktop file.
  category: Utility;Office
  # One picture per size (16 to 512), drawn by `pnpm icon`, so a Linux desktop
  # never has to scale the 1024 picture down itself.
  icon: build/icons
  desktop:
    entry:
      GenericName: AI assistant
      Keywords: AI;assistant;chat;LLM;local;offline;Ollama;LM Studio;MCP;
  # The .desktop file is named after desktopName in package.json, and its
  # StartupWMClass is that name too (openstellarfirm), so a Linux desktop puts
  # the running window under the app's own launcher and icon. Electron takes the
  # Wayland app id from desktopName, and on X11 sets WM_CLASS to the product
  # name in lower case (openstellarfirm) and as written (OpenStellarFirm); the
  # lower-case one is what StartupWMClass matches.
  syncDesktopName: true
  # No deb or rpm yet: they need a maintainer email address the project has not chosen.
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
appImage:
  # electron-builder names an AppImage x86_64 and every other file x64. One
  # name for both, so the downloads read alike. Only x64 is built for Linux; a
  # second Linux architecture needs its own name here.
  artifactName: OpenStellarFirm-${version}-linux-x64.${ext}
  # electron-builder writes --no-sandbox into the AppImage's .desktop entry by
  # default, which turns Chromium's sandbox off for every window, the reader
  # of attached files too. The AppImage's own launcher adds it only where the
  # system has no user namespaces, so the entry carries no switch.
  executableArgs: []
